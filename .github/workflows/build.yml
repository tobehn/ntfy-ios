# Compile check for the fork (not meant to be merged upstream): builds the app and the
# notification service extension for the iOS simulator, without code signing.
name: build

on:
  push:
    branches:
      - "ci/**"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # GoogleService-Info.plist is not part of the repository, but it is a required resource
      # of the app target. A placeholder is enough to compile.
      - name: Create placeholder GoogleService-Info.plist
        run: |
          cat > ntfy/Assets/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>placeholder</string>
            <key>GCM_SENDER_ID</key>
            <string>000000000000</string>
            <key>BUNDLE_ID</key>
            <string>io.heckel.ntfy</string>
            <key>PROJECT_ID</key>
            <string>placeholder</string>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:0000000000000000</string>
          </dict>
          </plist>
          PLIST

      - name: Build for iOS simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project ntfy.xcodeproj \
            -scheme ntfy \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log \
            | grep -E "error:|warning: .*(Notification\.swift|NotificationContent\.swift)|BUILD (SUCCEEDED|FAILED)|^\*\*" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
